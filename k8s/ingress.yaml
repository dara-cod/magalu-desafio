apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: magalu-app
  namespace: magalu
spec:
  ingressClassName: nginx
  rules:
    - host: magalu.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: magalu-app
                port:
                  number: 80