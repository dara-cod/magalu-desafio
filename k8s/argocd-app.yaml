apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: magalu-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/dara-cod/magalu-desafio
    targetRevision: HEAD
    path: helm/magalu-app
  destination:
    server: https://kubernetes.default.svc
    namespace: magalu
  syncPolicy:
    automated:
      prune: true
      selfHeal: true