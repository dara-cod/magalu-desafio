name: pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Terraform Lint
        run: terraform fmt -check

      - name: Docker Build
        run: docker build -t magalu/app ./app

      - name: Trivy Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: magalu/app